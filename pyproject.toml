[project]
name = "price_prediction_backtest"
version = "0.1.0"
description = "Walk-forward backtest of Markov / Kalman / LSTM next-day return models plus a regime-gated Darvas replay"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "pyarrow"]

[project.optional-dependencies]
nets = ["torch"]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["price_prediction"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["graphify-out", "reports", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B905"]  # zip(strict=) is Python 3.10+

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no torch — LSTM tests skip when absent)
        run: pip install -q numpy pandas pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
